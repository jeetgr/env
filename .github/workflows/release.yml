name: Release

# Manually triggered: run `pnpm changeset version` locally, review the
# CHANGELOG diff, commit and push it to main, then run this workflow
# (Actions tab -> Release -> Run workflow, or `gh workflow run release.yml`).
#
# Publishes via npm Trusted Publishing (OIDC), no npm token stored anywhere.
# This also gets us provenance for free, since it's the same OIDC exchange.
# One-time setup on npmjs.com: package Settings -> Trusted Publisher -> add
# a GitHub Actions publisher for jeetgr/env, workflow filename "release.yml".
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      # Trusted Publishing needs a recent npm CLI; the one bundled with
      # Node 22 predates it.
      - run: npm install -g npm@latest

      - run: pnpm release

      - run: git push --follow-tags
